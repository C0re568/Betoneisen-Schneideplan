name: GitHub Pages

# Veröffentlicht schneideplan.html unter der Wurzel-URL der Seite.
# Die Datei behält im Repository ihren sprechenden Namen; für Pages wird sie
# zusätzlich als index.html abgelegt, damit der Link kurz bleibt.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Seite zusammenstellen
        run: |
          mkdir -p site
          cp schneideplan.html site/index.html
          cp schneideplan.html site/schneideplan.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
