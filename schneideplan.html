<!doctype html>
<meta charset="utf-8">
<title>Schneideplan Betoneisen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --ink:#15181d; --muted:#5c6674;
    --line:#d9dee5; --line-soft:#eceff3;
    --accent:#1f6feb; --accent-soft:#e7f0ff;
    --warn:#b45309; --warn-soft:#fff4e3;
    --bad:#c02626; --bad-soft:#fdeaea;
    --ok:#166534; --ok-soft:#e8f6ec;
    --waste:#c9ced6;
    --radius:10px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  :root:not([data-theme="light"]){}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12151a; --panel:#1a1e25; --ink:#e8ecf2; --muted:#9aa5b4;
      --line:#2c333d; --line-soft:#232931;
      --accent:#6aa4ff; --accent-soft:#1d2a3f;
      --warn:#f0b357; --warn-soft:#3a2e18;
      --bad:#ff8080; --bad-soft:#3a2020;
      --ok:#7ddc9b; --ok-soft:#17301f;
      --waste:#3a424d;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12151a; --panel:#1a1e25; --ink:#e8ecf2; --muted:#9aa5b4;
    --line:#2c333d; --line-soft:#232931;
    --accent:#6aa4ff; --accent-soft:#1d2a3f;
    --warn:#f0b357; --warn-soft:#3a2e18;
    --bad:#ff8080; --bad-soft:#3a2020;
    --ok:#7ddc9b; --ok-soft:#17301f;
    --waste:#3a424d;
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:24px 18px 80px}
  h1{font-size:24px; margin:0 0 4px; letter-spacing:-.01em}
  h2{font-size:17px; margin:0 0 12px; letter-spacing:-.01em}
  h3{font-size:14px; margin:0 0 8px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
  p.sub{margin:0 0 22px; color:var(--muted); font-size:14px}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:16px}
  .row{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end}
  label.f{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted)}
  input,select{
    font:inherit; color:var(--ink); background:var(--panel);
    border:1px solid var(--line); border-radius:6px; padding:6px 8px; min-width:0;
  }
  input:focus,select:focus{outline:2px solid var(--accent); outline-offset:-1px}
  input[type=number]{font-variant-numeric:tabular-nums}
  input[type=checkbox]{accent-color:var(--accent)}
  button{
    font:inherit; font-weight:500; cursor:pointer; color:var(--ink);
    background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:7px 12px;
  }
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  button.primary:hover{filter:brightness(1.08)}
  button.mini{padding:2px 7px; font-size:12px; line-height:1.4}
  button.danger:hover{border-color:var(--bad); color:var(--bad)}
  .btnbar{display:flex; flex-wrap:wrap; gap:8px}
  .btnbar.sec button{font-size:13px; padding:5px 10px; color:var(--muted)}
  .btnbar.sec button:hover{color:var(--ink)}

  table{border-collapse:collapse; width:100%; font-size:14px}
  th,td{text-align:left; padding:5px 8px; border-bottom:1px solid var(--line-soft); vertical-align:middle}
  th{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; white-space:nowrap}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
  .tbl-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}

  /* Aufklappbare Abschnitte (Schritt 2 und 3) — am Telefon zugeklappt,
     damit der Weg von der Stückliste zum Knopf kurz bleibt. */
  details.panel{padding:0}
  details.panel > summary{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:14px 16px; cursor:pointer; list-style:none; font-size:17px; font-weight:600; letter-spacing:-.01em;
  }
  details.panel > summary::-webkit-details-marker{display:none}
  details.panel > summary::after{
    content:"⌄"; margin-left:auto; color:var(--muted); font-size:18px; line-height:1;
    transform:translateY(-3px); transition:transform .15s;
  }
  details.panel[open] > summary::after{transform:rotate(180deg) translateY(-1px)}
  details.panel > summary:hover{color:var(--accent)}
  details.panel .body{padding:0 16px 16px}
  .sum{font-size:13px; font-weight:400; color:var(--muted)}

  .list-card{border:1px solid var(--line); border-radius:var(--radius); padding:12px; margin-bottom:12px; background:var(--panel)}
  .list-head{display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap}
  .list-head input{font-weight:600; flex:1 1 220px}
  .rowtable input[type=text]{width:100%; min-width:64px}
  .rowtable input[type=number]{width:100%; min-width:56px}
  .fixlbl{display:none}   /* am Telefon steht der Spaltenkopf am Feld, siehe unten */

  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px}
  .dia-grid{display:flex; flex-wrap:wrap; gap:10px}
  .dia-grid > .kpi{flex:0 1 210px}
  .kpi{border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--panel)}
  .kpi .k{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted)}
  .kpi .v{font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  .kpi .n{font-size:12px; color:var(--muted)}

  .bar{margin:0 0 10px; break-inside:avoid; page-break-inside:avoid}
  .bar-head{display:flex; justify-content:space-between; gap:10px; font-size:12px; color:var(--muted); margin-bottom:3px; flex-wrap:wrap}
  .bar-head b{color:var(--ink); font-size:13px; font-family:var(--mono)}
  .bar-vis{display:flex; height:30px; border:1px solid var(--line); border-radius:5px; overflow:hidden; background:var(--waste)}
  .seg{display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600;
       color:#10131a; overflow:hidden; white-space:nowrap; border-right:1px solid rgba(0,0,0,.28)}
  .seg.rest{background:repeating-linear-gradient(45deg,transparent,transparent 5px,rgba(128,128,128,.35) 5px,rgba(128,128,128,.35) 10px);
            color:var(--muted); font-weight:500; border-right:none}
  .chips{display:flex; flex-wrap:wrap; gap:4px; margin-top:4px}
  .chip{font-size:11px; padding:1px 6px; border-radius:20px; border:1px solid var(--line); background:var(--panel); font-family:var(--mono)}

  .ticks{display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin-top:5px}
  .tick{display:inline-flex; gap:4px; align-items:center; font-family:var(--mono); font-size:11px;
        border:1px solid var(--line); border-radius:4px; padding:1px 6px; cursor:pointer; background:var(--panel)}
  .tick:hover{border-color:var(--accent)}
  .tick input{margin:0; width:13px; height:13px; accent-color:var(--accent)}
  .tick.on{background:var(--ok-soft); border-color:var(--ok); color:var(--ok); text-decoration:line-through}
  .tickcount{font-size:11px; color:var(--muted); white-space:nowrap}
  .bar.alldone .bar-vis{opacity:.4}
  .bar.alldone .bar-head b{text-decoration:line-through}
  .prog{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
  .prog b{color:var(--ok)}

  /* Fortschritt je Position in der Stückliste (aus den Haken im Plan zurückgerechnet) */
  .rowtable td.dcell{font-size:12px; line-height:1.3; color:var(--muted); font-variant-numeric:tabular-nums}
  .rowtable td.dcell b{font-size:13px; color:var(--ink)}
  .rowtable td.dcell[data-donestate="all"], .rowtable td.dcell[data-donestate="all"] b{color:var(--ok)}
  .rowtable td.dcell[data-donestate="stale"]{color:var(--warn)}
  .rowtable tr.posdone input{opacity:.7}
  .rowtable tr.posdone input[type=text]{text-decoration:line-through}

  .tag{display:inline-block; font-size:11px; padding:1px 7px; border-radius:20px; font-weight:600}
  .tag.bad{background:var(--bad-soft); color:var(--bad)}
  .tag.warn{background:var(--warn-soft); color:var(--warn)}
  .tag.ok{background:var(--ok-soft); color:var(--ok)}
  .tag.info{background:var(--accent-soft); color:var(--accent)}

  .note{border-left:3px solid var(--accent); background:var(--accent-soft); padding:10px 12px; border-radius:0 6px 6px 0; font-size:14px; margin:0 0 12px}
  .note.warn{border-color:var(--warn); background:var(--warn-soft)}
  .note.bad{border-color:var(--bad); background:var(--bad-soft)}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .only-mob{display:none}   /* Gegenstück: .hide-mob, siehe Telefon-Block */
  details{margin-top:8px}
  summary{cursor:pointer; font-size:13px; color:var(--muted)}
  .hidden{display:none !important}
  .grp-title{display:flex; align-items:baseline; gap:10px; margin:18px 0 10px; flex-wrap:wrap}
  .grp-title .d{font-size:19px; font-weight:600}
  hr{border:none; border-top:1px solid var(--line); margin:18px 0}

  /* Sprachumschalter / language switch */
  .topbar{display:flex; justify-content:flex-end; align-items:center; gap:8px; margin:0 0 12px; flex-wrap:wrap}
  /* linke Gruppe der Kopfzeile (Datei speichern, Projektlink) */
  .topbar .tb-left{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-right:auto}
  .langsw{display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--panel)}
  .langsw button{border:none; border-radius:0; background:transparent; color:var(--muted); padding:5px 14px; font-size:13px}
  .langsw button + button{border-left:1px solid var(--line)}
  .langsw button:hover{color:var(--ink)}
  .langsw button[aria-pressed="true"]{background:var(--accent); color:#fff; font-weight:600}
  .langsw button[aria-pressed="true"]:hover{color:#fff}
  /* dezenter Knopf in der Kopfzeile; steht links neben dem Sprachumschalter */
  .ghost{padding:5px 12px; font-size:13px; font-weight:400; color:var(--muted); border-radius:999px}
  .ghost:hover{color:var(--ink); border-color:var(--muted)}
  /* derselbe Knopf als Link (Projekt auf GitHub) */
  a.ghost{display:inline-flex; align-items:center; gap:6px; text-decoration:none; line-height:1.5;
          background:var(--panel); border:1px solid var(--line)}
  a.ghost svg{width:15px; height:15px; fill:currentColor; flex:none}

  /* Aktionsleiste: der Knopf „berechnen" steht dort, wo die Eingabe endet.
     Am Telefon klebt sie unten am Bildschirmrand und ist immer erreichbar. */
  .actionbar{margin:0 0 16px}
  .ab-inner{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  #btnCalc{font-size:16px; padding:10px 20px}
  .ab-note{font-size:13px; color:var(--muted)}
  .ab-note.stale{color:var(--warn); font-weight:600}
  #btnJump{display:none}
  .ab-prog{display:none; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
  .ab-prog b{color:var(--ok)}
  body.hasresult .ab-prog{display:inline}
  /* Ergebnis veraltet: Eingaben wurden nach der letzten Rechnung geändert. */
  body.stale #out{opacity:.55}
  body.stale #btnCalc{box-shadow:0 0 0 3px var(--accent-soft)}

  #resultTools{margin:0 0 12px; align-items:center}

  /* ---------- Telefon ---------- */
  @media (max-width:760px){
    /* Platz für die feste Leiste am unteren Rand; die Höhe meldet das Skript */
    .wrap{padding:16px 12px calc(var(--abh, 60px) + 28px)}
    h1{font-size:20px}
    h2{font-size:16px}
    h3{font-size:12px; letter-spacing:.04em}
    .dia-grid > .kpi{flex:1 1 100%}
    p.sub{font-size:13px; margin-bottom:16px}
    .panel{padding:12px}
    details.panel > summary{padding:12px; font-size:16px}
    details.panel .body{padding:0 12px 12px}
    /* Schriftgröße 16 px: kleinere Werte lassen iOS beim Antippen hineinzoomen. */
    input,select{font-size:16px; padding:9px 10px}
    button{padding:10px 14px}
    button.mini{padding:6px 11px; font-size:13px}
    /* am Telefon so groß antippbar wie die Knöpfe daneben */
    .ghost{padding:8px 13px}
    input[type=checkbox]{width:20px; height:20px}
    .cards{grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
    .kpi .v{font-size:18px}

    /* Kein Querscrollen mehr: jede Tabellenzeile wird zu einer eigenen Karte,
       die Spaltenköpfe stehen als Beschriftung am Wert. */
    .tbl-scroll{overflow-x:visible}
    table.resp, table.resp tbody{display:block}
    table.resp thead{display:none}
    table.resp tr{
      display:block; border:1px solid var(--line); border-radius:8px;
      padding:8px 10px; margin-bottom:8px;
    }
    table.resp td{
      display:flex; gap:12px; justify-content:space-between; align-items:baseline; flex-wrap:wrap;
      border:none; padding:3px 0; text-align:right;
    }
    /* lange Aufzählungen (z. B. „geschnitten aus Stange") brauchen die volle Breite */
    table.resp td.wide{display:block; text-align:left}
    table.resp td.wide::before{display:block; margin-bottom:2px}
    table.resp td::before{
      content:attr(data-label); flex:0 0 auto; text-align:left;
      font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600;
    }
    table.resp td.rowhead{
      display:block; text-align:left; font-size:15px;
      border-bottom:1px solid var(--line-soft); padding-bottom:6px; margin-bottom:4px;
    }
    table.resp td.rowhead::before{content:none}
    table.resp td[data-label=""]::before{content:none}
    table.resp td br{display:none}
    table.resp td .small{margin-left:6px}
    .only-mob{display:inline}
    .hide-mob{display:none !important}

    /* Eingabetabellen: eine Karte je Zeile, die Zahlenfelder nebeneinander. */
    .rowtable, .rowtable tbody{display:block}
    .rowtable thead{display:none}
    .rowtable tr{
      display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px 10px;
      border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:10px;
    }
    .rowtable td{display:block; border:none; padding:0; text-align:left !important}
    .rowtable td::before{
      content:attr(data-label); display:block; margin-bottom:3px;
      font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:600;
    }
    .rowtable td[data-label=""]::before{content:none}
    .rowtable.pos td.c-pos {grid-area:1/1/2/3}
    .rowtable.pos td.c-del {grid-area:1/3/2/4; align-self:center; text-align:right !important}
    .rowtable.pos td.c-qty {grid-area:2/1/3/2}
    .rowtable.pos td.c-dia {grid-area:2/2/3/3}
    .rowtable.pos td.c-len {grid-area:2/3/3/4}
    .rowtable.pos td.c-fix {grid-area:3/1/4/2; align-self:center}
    .rowtable.pos td.c-done{grid-area:3/2/4/4; align-self:center; text-align:right !important}
    .rowtable.pos td.c-fix label{display:inline-flex; gap:8px; align-items:center; font-size:13px; color:var(--ink)}
    .fixlbl{display:inline}
    .rowtable.rest td.c-dia {grid-area:1/1/2/2}
    .rowtable.rest td.c-len {grid-area:1/2/2/3}
    .rowtable.rest td.c-qty {grid-area:1/3/2/4}
    .rowtable.rest td.c-note{grid-area:2/1/3/3}
    .rowtable.rest td.c-del {grid-area:2/3/3/4; align-self:end; text-align:right !important}

    /* Abhaken am Gerät: große Fläche, ein Griff je Eintrag. */
    .bar{margin-bottom:16px}
    .bar-vis{height:34px}
    .ticks{margin-top:8px}
    .tick{flex:1 1 auto; justify-content:center; padding:9px 12px; font-size:14px; font-family:inherit}
    .tick input{width:20px; height:20px}
    .tickcount{flex-basis:100%; text-align:center}

    /* Aktionsleiste klebt unten */
    .actionbar{
      position:fixed; left:0; right:0; bottom:0; z-index:40; margin:0;
      background:var(--panel); border-top:1px solid var(--line);
      padding:8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
      box-shadow:0 -2px 14px rgba(0,0,0,.14);
    }
    .ab-inner{gap:8px}
    #btnCalc{flex:1 1 auto; min-width:0}
    .ab-note{display:none}
    body.hasresult #btnJump{display:inline-block; flex:0 0 auto; white-space:nowrap}
    .ab-prog{order:-1; flex-basis:100%; text-align:center; margin-bottom:2px}
    body.hasresult .ab-prog{display:block}
    .grp-title .prog{margin-left:0 !important}
  }

  @media print{
    body{background:#fff}
    body.stale #out{opacity:1}
    .no-print{display:none !important}
    .panel,.list-card{border-color:#bbb; box-shadow:none}
    .wrap{max-width:none; padding:0}
    .seg{color:#000}
    a{text-decoration:none; color:inherit}
    /* zum Drucken werden alle Klappen geöffnet (siehe beforeprint) */
    details > summary{display:none}
  }
</style>

<div class="wrap">
  <div class="topbar no-print">
    <div class="tb-left">
      <button type="button" id="btnSaveApp" class="hidden ghost" data-i18n="btn.saveApp" data-i18n-title="btn.saveAppHint"></button>
      <!-- Projektseite: Quellcode, neue Fassungen, Fehlermeldungen. Steht auch in der
           heruntergeladenen Datei, damit man von dort zur Online-Fassung zurückfindet. -->
      <a class="ghost" id="lnkRepo" href="https://github.com/C0re568/Betoneisen-Schneideplan"
         target="_blank" rel="noopener noreferrer"
         data-i18n-title="btn.repoHint">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        <span data-i18n="btn.repo"></span>
      </a>
    </div>
    <span class="small muted" data-i18n="lang.label"></span>
    <div class="langsw" id="langsw" role="group" aria-label="Sprache / Language">
      <button type="button" data-lang="de" aria-pressed="true">Deutsch</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
  </div>

  <h1 data-i18n="app.title"></h1>
  <p class="sub" data-i18n="app.sub"></p>

  <div class="panel no-print">
    <h2 data-i18n="lists.h"></h2>
    <div id="lists"></div>
    <div class="btnbar" style="margin-top:10px">
      <button id="btnAddList" data-i18n="lists.add"></button>
    </div>
    <div class="btnbar sec" style="margin-top:10px">
      <button id="btnDemo" data-i18n="lists.demo"></button>
      <button id="btnExport" data-i18n="lists.export"></button>
      <button id="btnImport" data-i18n="lists.import"></button>
      <button id="btnClear" class="danger" data-i18n="lists.clear"></button>
      <input type="file" id="fileImport" accept=".json,application/json" class="hidden">
    </div>
    <p class="small muted" style="margin:10px 0 0" data-i18n-html="lists.foot"></p>
  </div>

  <details class="panel no-print" id="secMaterial" open>
    <summary><span data-i18n="set.h"></span> <span class="sum" id="matSum"></span></summary>
    <div class="body">
      <div class="row">
        <label class="f"><span data-i18n="set.stockDefault"></span>
          <input type="number" id="stockDefault" value="7" step="0.01" min="0.5" style="width:110px">
        </label>
        <label class="f"><span data-i18n="set.minRest"></span>
          <input type="number" id="minRest" value="1.00" step="0.05" min="0" style="width:130px">
        </label>
        <label class="f"><span data-i18n="set.effort"></span>
          <select id="effort">
            <option value="1" data-i18n="set.effort1"></option>
            <option value="2" selected data-i18n="set.effort2"></option>
            <option value="3" data-i18n="set.effort3"></option>
          </select>
        </label>
        <label class="f" style="justify-content:flex-end">&nbsp;
          <span class="small" style="display:flex; gap:8px; align-items:center; padding-bottom:9px; color:var(--ink)">
            <input type="checkbox" id="groupSame" checked> <span data-i18n="set.groupSame"></span>
          </span>
        </label>
      </div>
      <div id="diaSettings" style="margin-top:12px"></div>

function t(key, vars) {
  const dict = I18N[LANG] || I18N.de;
  let s = dict[key];
  if (s == null) s = I18N.de[key];
  if (s == null) return key;
  return typeof s === "function" ? s(vars || {}) : s;
}

/* ---------- Optimierung (1D-Cutting-Stock) ---------- */

// Exakte Suche (Branch & Bound) nach dem best gefüllten Muster für eine Stange.
function bestPattern(lens, avail, cap, budget) {
  const n = lens.length, cur = new Array(n).fill(0);
  let best = -1, bestCounts = new Array(n).fill(0), nodes = 0;
  function dfs(i, rem, fill) {
    if (fill > best) { best = fill; bestCounts = cur.slice(); }
    if (best === cap) return true;
    if (i >= n) return false;
    if (fill + rem <= best) return false;
    if (++nodes > budget) return true;
    const kmax = Math.min(avail[i], Math.floor(rem / lens[i]));
    for (let k = kmax; k >= 0; k--) {
      cur[i] = k;
      if (dfs(i + 1, rem - k * lens[i], fill + k * lens[i])) { cur[i] = 0; return true; }
    }
    cur[i] = 0;
    return false;
  }
  dfs(0, cap, 0);
  return bestCounts;
}

// Sequentielle Heuristik: immer das beste Muster wählen und (optional) maximal oft wiederholen.
function greedyPatterns(buckets, cap, budget, repeat) {
  const lens = buckets.map(b => b.len), avail = buckets.map(b => b.qty), bars = [];
  let guard = 0;
  while (avail.some(a => a > 0)) {
    if (++guard > 20000) break;
    const pat = bestPattern(lens, avail, cap, budget);
    if (!pat.some(k => k > 0)) break;
    let reps = 1;
    if (repeat) {
      reps = Infinity;
      pat.forEach((k, i) => { if (k > 0) reps = Math.min(reps, Math.floor(avail[i] / k)); });
      reps = Math.max(1, reps);
    }
    const bar = [];
    pat.forEach((k, i) => { for (let j = 0; j < k; j++) bar.push(lens[i]); });
    for (let r = 0; r < reps; r++) bars.push(bar.slice());
    pat.forEach((k, i) => { avail[i] -= k * reps; });
  }
  return bars;
}

// Best-Fit-Decreasing, optional leicht randomisiert (für Mehrfachstarts).
function bfd(pieces, cap, jitter) {
  const arr = pieces.slice().sort((a, b) => b - a);
  if (jitter) {
    for (let i = 0; i < arr.length; i++) {
      if (Math.random() < 0.35) {
        const j = Math.min(arr.length - 1, i + 1 + Math.floor(Math.random() * 3));
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
    }
  }
  const bars = [], rem = [];
  for (const p of arr) {
    let bi = -1, bestRem = Infinity;
    for (let i = 0; i < bars.length; i++) if (rem[i] >= p && rem[i] - p < bestRem) { bestRem = rem[i] - p; bi = i; }
    if (bi < 0) { bars.push([p]); rem.push(cap - p); } else { bars[bi].push(p); rem[bi] -= p; }
  }
  return bars;
}

// Bewertung: primär Stangenanzahl, sekundär möglichst großes (=verwertbares) Reststück.
function score(bars, cap) {
  let maxRest = 0;
  for (const b of bars) { const r = cap - b.reduce((s, x) => s + x, 0); if (r > maxRest) maxRest = r; }
  return [bars.length, -maxRest];
}
const better = (a, b) => a[0] !== b[0] ? a[0] < b[0] : a[1] < b[1];

function solveGroup(buckets, cap, restarts, budget) {
  const pieces = [];
  buckets.forEach(b => { for (let i = 0; i < b.qty; i++) pieces.push(b.len); });
  if (!pieces.length) return [];
  let best = greedyPatterns(buckets, cap, budget, true), bestScore = score(best, cap);
  for (const cand of [greedyPatterns(buckets, cap, budget, false), bfd(pieces, cap, false)]) {
    const cs = score(cand, cap);
    if (better(cs, bestScore)) { best = cand; bestScore = cs; }
  }
  for (let it = 0; it < restarts; it++) {
    const c = bfd(pieces, cap, true), s = score(c, cap);
    if (better(s, bestScore)) { best = c; bestScore = s; }
  }
  best.forEach(b => b.sort((a, x) => x - a));
  best.sort((a, b) => (b.reduce((s, x) => s + x, 0)) - (a.reduce((s, x) => s + x, 0)));
  return best;
}

/* Plant eine Gruppe mit optionalen Reststangen.
   Reststangen sind Gratismaterial, kosten aber Lagerbestand: sie werden nur eingesetzt,
   wenn dadurch neue Stangen eingespart werden. Rangfolge: (1) neue Stangen, (2) Anzahl
   angebrochener Reststangen, (3) verbrauchtes Restmaterial. */
function planGroup(buckets, cap, remnants, restarts, budget) {
  const variants = [];
  for (const ord of (remnants.length ? [null, "asc", "desc"] : [null])) {
    const lens = buckets.map(b => b.len), avail = buckets.map(b => b.qty), rbars = [];
    if (ord) {
      const rs = remnants.slice().sort(ord === "asc" ? (a, b) => a - b : (a, b) => b - a);
      for (const R of rs) {
        if (!avail.some(a => a > 0)) break;
        const pat = bestPattern(lens, avail, R, budget);
        const pieces = [];
        pat.forEach((k, j) => { for (let t = 0; t < k; t++) pieces.push(lens[j]); });
        if (pieces.length) { rbars.push({ cap: R, pieces }); pat.forEach((k, j) => { avail[j] -= k; }); }
      }
    }
    const left = buckets.map((b, i) => ({ len: b.len, qty: avail[i] })).filter(b => b.qty > 0);
    const nbars = left.length ? solveGroup(left, cap, restarts, budget) : [];
    const usedFromRest = rbars.reduce((s, b) => s + b.pieces.reduce((t, x) => t + x, 0), 0);
    variants.push({ rbars, nbars, usedFromRest });
  }
  variants.sort((a, b) =>
    a.nbars.length - b.nbars.length || a.rbars.length - b.rbars.length || a.usedFromRest - b.usedFromRest);
  const v = variants[0];
  const cutNew = v.nbars.reduce((s, b) => s + b.reduce((t, x) => t + x, 0), 0);
  return { barsRest: v.rbars, barsNew: v.nbars, usedFromRest: v.usedFromRest, wasteNew: v.nbars.length * cap - cutNew };
}

/* ---------- Berechnung + Ausgabe ---------- */
function calc() {
  const effort = +$("effort").value;
  const restarts = effort === 1 ? 60 : effort === 2 ? 400 : 1500;
  const budget = effort === 1 ? 20000 : effort === 2 ? 120000 : 600000;
  const looRestarts = effort === 1 ? 20 : effort === 2 ? 60 : 200;
  const minRest = mm(state.minRest);

  // Positionen einsammeln
  const items = [], errors = [];
  state.lists.forEach((L, li) => L.rows.forEach((r, ri) => {
    const qty = Math.round(+r.qty || 0), dia = +r.dia || 0, len = +r.len || 0;
    if (qty <= 0 || dia <= 0 || len <= 0) return;
    items.push({
      key: li + ":" + ri, list: L.name, listIx: li, pos: r.pos || "?",
      label: listShort(li) + "·" + (r.pos || "?"),
      qty, dia, lenM: len, len: mm(len), fix: !!r.fix
    });
  }));
  // Mehrere Zeilen mit gleicher Positionsnummer eindeutig kennzeichnen (z. B. UZ6a / UZ6b)
  const seen = new Map();
  items.forEach(it => seen.set(it.label, (seen.get(it.label) || 0) + 1));
  const used = new Map();
  items.forEach(it => {
    if (seen.get(it.label) > 1) {
      const n = (used.get(it.label) || 0); used.set(it.label, n + 1);
      it.pos = it.pos + String.fromCharCode(97 + n);
      it.label = it.label + String.fromCharCode(97 + n);
    }
  });
  if (!items.length) { lastResult = { empty: true }; showNoItems(); return; }

  const stockOf = d => mm((state.dia[d] && state.dia[d].stock) || state.stockDefault);
  const ringOf = d => !!(state.dia[d] && state.dia[d].ring);

  // Hinweise werden als Daten gesammelt und erst beim Rendern übersetzt,
  // damit sie beim Sprachwechsel mitwandern.
  items.forEach(it => {
    if (!it.fix && !ringOf(it.dia) && it.len > stockOf(it.dia))
      errors.push({ key: "err.tooLong", label: it.label, lenM: it.lenM, capM: m(stockOf(it.dia)) });
  });

  // Vorhandene Reststangen je ø (stückweise aufgelöst)
  const restsByDia = new Map();
  (state.rests || []).forEach(r => {
    const dia = +r.dia || 0, len = mm(+r.len || 0), qty = Math.round(+r.qty || 0);
    if (dia <= 0 || len <= 0 || qty <= 0) return;
    if (!restsByDia.has(dia)) restsByDia.set(dia, []);
    for (let i = 0; i < qty; i++) restsByDia.get(dia).push(len);
  });

  // Gruppierung nach ø
  const groups = new Map();
  items.forEach(it => {
    if (!groups.has(it.dia)) groups.set(it.dia, { dia: it.dia, cap: stockOf(it.dia), ring: ringOf(it.dia), items: [] });
    groups.get(it.dia).items.push(it);
  });

  const results = [];
  for (const g of [...groups.values()].sort((a, b) => a.dia - b.dia)) {
    const cut = g.items.filter(it => !it.fix && !g.ring && it.len <= g.cap);
    const fixed = g.items.filter(it => it.fix || g.ring || it.len > g.cap);

    // Längen-Buckets (gleiche Längen sind untereinander austauschbar)
    const bmap = new Map();
    cut.forEach(it => {
      if (!bmap.has(it.len)) bmap.set(it.len, { len: it.len, qty: 0, src: [] });
      const b = bmap.get(it.len); b.qty += it.qty; b.src.push({ it, qty: it.qty });
    });
    const buckets = [...bmap.values()].sort((a, b) => b.len - a.len);
    const remnants = (restsByDia.get(g.dia) || []).filter(L => L <= 100000);

    const plan = buckets.length
      ? planGroup(buckets, g.cap, remnants, restarts, budget)
      : { barsRest: [], barsNew: [], usedFromRest: 0, wasteNew: 0 };

    // Stücke wieder den Positionen zuordnen (Warteschlange je Länge, positionsweise)
    const queue = new Map();
    buckets.forEach(b => {
      const q = [];
      b.src.forEach(s => { for (let i = 0; i < s.qty; i++) q.push(s.it); });
      queue.set(b.len, q);
    });
    const mkBar = (piecesLen, id, kind, cap) => {
      const pieces = piecesLen.map(L => ({ len: L, it: queue.get(L).shift() }));
      const used = pieces.reduce((s, p) => s + p.len, 0);
      return { id, kind, cap, pieces, used, rest: cap - used };
    };
    const barsRest = plan.barsRest.map((b, i) => mkBar(b.pieces, `R${g.dia}-${String(i + 1).padStart(2, "0")}`, "rest", b.cap));
    const barsNew = plan.barsNew.map((p, i) => mkBar(p, `S${g.dia}-${String(i + 1).padStart(3, "0")}`, "neu", g.cap));
    const bars = [...barsRest, ...barsNew];

    const totalNeed = cut.reduce((s, it) => s + it.qty * it.len, 0);
    const totalStock = barsNew.length * g.cap;              // neu zu beschaffendes Material
    const wasteAll = plan.wasteNew;                         // Verschnitt auf neuen Stangen
    const remnantTotal = remnants.reduce((s, L) => s + L, 0);
    const restLeftover = barsRest.reduce((s, b) => s + b.rest, 0);

    // Verschnitt-Analyse je Position
    const analysis = cut.map(it => {
      const perBar = Math.floor(g.cap / it.len);
      const barsAlone = Math.ceil(it.qty / perBar);
      const wasteAlone = barsAlone * g.cap - it.qty * it.len;
      // Grenzbeitrag: Plan ohne diese Position neu rechnen
      const bm2 = new Map();
      cut.forEach(o => {
        if (o === it) return;
        if (!bm2.has(o.len)) bm2.set(o.len, { len: o.len, qty: 0, src: [] });
        bm2.get(o.len).qty += o.qty;
      });
      const b2 = [...bm2.values()].sort((a, b) => b.len - a.len);
      const plan2 = b2.length ? planGroup(b2, g.cap, remnants, looRestarts, budget) : { wasteNew: 0 };
      const marginal = wasteAll - plan2.wasteNew;
      return {
        it, perBar, barsAlone,
        wasteAlone, wasteAloneRatio: wasteAlone / (barsAlone * g.cap || 1),
        marginal,
        wasteBars: marginal / g.cap,                    // Verschnitt in "ganzen Lagerstangen"
        ownRatio: marginal / (it.qty * it.len),         // Verschnitt bezogen auf eigenen Bedarf
        mass: it.qty * it.lenM * kgPerM(it.dia)
      };
    }).sort((a, b) => b.marginal - a.marginal || b.wasteAlone - a.wasteAlone);

    results.push({
      g, bars, barsNew, barsRest, cut, fixed, analysis,
      totalNeed, totalStock, wasteAll,
      remnants, remnantTotal, usedFromRest: plan.usedFromRest, restLeftover,
      lower: Math.ceil(Math.max(0, totalNeed - remnantTotal) / g.cap),
      usableRest: bars.filter(b => b.rest >= minRest && b.rest > 0),
      kgm: kgPerM(g.dia)
    });
  }
  lastResult = { results, errors, minRest };
  render(results, errors, minRest);
}

/* ---------- Ausgabe ---------- */
function colorFor(ix) { return `hsl(${(ix * 47 + 14) % 360} 62% 68%)`; }

function showNoItems() {
  $("out").innerHTML = `<div class="panel"><p class="note bad">${esc(t("err.none"))}</p></div>`;
  document.body.classList.remove("hasresult");
  $("resultTools").classList.add("hidden");
  clearStale();
  $("btnCalc").textContent = t("btn.calc");
}

/* Schlüssel für den Erledigt-Haken. Enthält bewusst den Inhalt der Stange:
   ändert sich der Schnitt nach einer Neuberechnung, verfällt der Haken,
   statt auf einer inhaltlich anderen Stange stehen zu bleiben. */
function doneKey(b) {
  return `${b.id}|${b.cap}|${b.pieces.map(p => p.it.label + ":" + p.len).join(",")}`;
}

/* Je Eintrag im Schneideplan gibt es genau einen Haken. Dahinter stehen aber weiterhin
   die Schlüssel aller Stangen dieses Eintrags, damit der Fortschritt in Stangen zählt
   und ein Umschalten der Gruppierung die gesetzten Haken nicht verwirft. */
let tickGroups = [];

function tickKeys(cb) { return tickGroups[+cb.dataset.donegrp] || []; }

function refreshTicks() {
  const stat = root => {
    let n = 0, done = 0;
    root.querySelectorAll("[data-donegrp]").forEach(cb => {
      const keys = tickKeys(cb);
      n += keys.length; done += keys.filter(k => state.done[k]).length;
    });
    return { n, done };
  };
  document.querySelectorAll("#out .bar").forEach(bar => {
    const cb = bar.querySelector("[data-donegrp]"); if (!cb) return;
    const keys = tickKeys(cb), done = keys.filter(k => state.done[k]).length;
    cb.checked = keys.length > 0 && done === keys.length;
    cb.indeterminate = done > 0 && done < keys.length;   // nur bei importierten Altdaten möglich
    cb.closest(".tick").classList.toggle("on", cb.checked);
    bar.classList.toggle("alldone", cb.checked);
  });
  document.querySelectorAll("#out [data-prog]").forEach(el => {
    const s = stat(el.closest(".panel") || document);
    el.innerHTML = s.n ? t("prog.bars", { done: s.done, n: s.n }) : "";
  });
  const box = $("progAll");
  if (box) {
    const s = stat($("out"));
    box.innerHTML = `<div class="k">${esc(t("prog.k"))}</div>
      <div class="v"${s.done && s.done === s.n ? ` style="color:var(--ok)"` : ""}>${s.done} / ${s.n}</div>
      <div class="n">${esc(t("prog.n", { p: NF(s.n ? s.done / s.n * 100 : 0, 0) }))}</div>`;
    // dieselbe Zahl noch einmal in der Aktionsleiste — beim Abhaken am Gerät
    // steht sie sonst weit oben außer Sicht
    $("abProg").innerHTML = t("prog.short", { done: s.done, n: s.n, p: NF(s.n ? s.done / s.n * 100 : 0, 0) });
  }
  renderListProgress();
}

/* Fortschritt je Position: aus den abgehakten Stangen des letzten Plans zurückgerechnet.
   Die Haken sitzen an den Stangen, jedes Stück einer abgehakten Stange gehört aber weiterhin
   zu seiner Position — so lässt sich in der Stückliste ablesen, was davon schon geschnitten
   ist und was noch offen ist. */
function positionProgress() {
  const map = new Map();
  if (!lastResult || !lastResult.results) return map;
  lastResult.results.forEach(R => {
    R.cut.forEach(it => map.set(it.key, { it, n: it.qty, done: 0, inPlan: true }));
    R.fixed.forEach(it => map.set(it.key, { it, n: it.qty, done: 0, inPlan: false }));
    R.bars.forEach(b => {
      if (!state.done[doneKey(b)]) return;
      b.pieces.forEach(p => { const e = map.get(p.it.key); if (e) e.done++; });
    });
  });
  // Zeilen, die nach der Berechnung geändert wurden, tragen einen anderen Bedarf als der Plan.
  map.forEach((e, key) => {
    const [li, ri] = key.split(":").map(Number);
    const L = state.lists[li], r = L && L.rows[ri];
    e.stale = !r || Math.round(+r.qty || 0) !== e.it.qty || (+r.dia || 0) !== e.it.dia
      || (+r.len || 0) !== e.it.lenM || !!r.fix !== e.it.fix;
  });
  return map;
}

function renderListProgress() {
  const cells = document.querySelectorAll("#lists [data-doneof]");
  if (!cells.length) return;
  const map = positionProgress();
  cells.forEach(td => {
    const e = map.get(td.dataset.doneof);
    let st = "none", html = `<span class="muted">${esc(t("pos.doneNoPlan"))}</span>`, hint = t("pos.doneNoPlanHint");
    if (e && e.stale) {
      st = "stale"; html = esc(t("pos.doneStale")); hint = t("pos.doneStaleHint");
    } else if (e && !e.inPlan) {
      st = "nocut"; html = `<span class="muted">${esc(t("pos.doneNoCut"))}</span>`; hint = t("pos.doneNoCutHint");
    } else if (e) {
      const open = e.n - e.done;
      st = open === 0 ? "all" : "open";
      html = `${t("pos.doneCount", { done: e.done, n: e.n })}
        <span class="small">· ${esc(open === 0 ? t("pos.doneReady") : t("pos.doneOpen", { open }))}</span>`;
      hint = t("pos.doneHint", { done: e.done, n: e.n, open });
    }
    td.dataset.donestate = st;
    td.title = hint;
    td.innerHTML = html;
    td.closest("tr").classList.toggle("posdone", st === "all");
  });
}

$("out").addEventListener("change", e => {
  const cb = e.target.closest("[data-donegrp]"); if (!cb) return;
  tickKeys(cb).forEach(k => { if (cb.checked) state.done[k] = true; else delete state.done[k]; });
  refreshTicks(); save();
});

function render(results, errors, minRest, keepScroll) {
  const out = [];
  tickGroups = [];

  // Gesamtübersicht
  let gStock = 0, gNeed = 0, gWaste = 0, gBars = 0, gFixKg = 0, gRestKg = 0, gRestBars = 0;
  results.forEach(R => {
    gStock += R.totalStock * R.kgm / 1000; gNeed += R.totalNeed * R.kgm / 1000;
    gWaste += R.wasteAll * R.kgm / 1000; gBars += R.barsNew.length;
    gRestKg += R.usedFromRest * R.kgm / 1000; gRestBars += R.barsRest.length;
    R.fixed.forEach(it => gFixKg += it.qty * it.lenM * R.kgm);
  });

  out.push(`<div class="panel">
    <h2>${esc(t("res.h"))}</h2>
    ${errors.length ? `<div class="note bad"><b>${esc(t("res.notes"))}</b><br>${errors.map(e =>
        esc(t(e.key, { label: e.label, len: NF(e.lenM), cap: NF(e.capM) }))).join("<br>")}</div>` : ""}
    <div class="cards">
      <div class="kpi"><div class="k">${esc(t("kpi.bars.k"))}</div><div class="v">${NF0(gBars)} ${esc(t("unit.pcs"))}</div><div class="n">${esc(t("kpi.bars.n"))}</div></div>
      <div class="kpi"><div class="k">${esc(t("kpi.mat.k"))}</div><div class="v">${NF(gStock, 1)} kg</div><div class="n">${esc(t("kpi.mat.n", { kg: NF(gNeed, 1) }))}</div></div>
      <div class="kpi"><div class="k">${esc(t("kpi.waste.k"))}</div><div class="v">${NF(gWaste, 1)} kg</div><div class="n">${esc(t("kpi.waste.n", { p: NF(gStock ? gWaste / gStock * 100 : 0, 1) }))}</div></div>
      ${gRestBars ? `<div class="kpi" style="border-color:var(--ok)"><div class="k">${esc(t("kpi.rest.k"))}</div><div class="v" style="color:var(--ok)">${NF(gRestKg, 1)} kg</div><div class="n">${esc(t("kpi.rest.n", { n: gRestBars }))}</div></div>` : ""}
      ${gFixKg ? `<div class="kpi"><div class="k">${esc(t("kpi.fix.k"))}</div><div class="v">${NF(gFixKg, 1)} kg</div><div class="n">${esc(t("kpi.fix.n"))}</div></div>` : ""}
      <div class="kpi" id="progAll"></div>
    </div>
  </div>`);

  // Bestellliste
  out.push(`<div class="panel">
    <h3>${esc(t("order.h"))}</h3>
    <div class="tbl-scroll"><table class="resp">
      <thead><tr><th>ø</th><th class="num">${esc(t("th.stockLen"))}</th><th class="num">${esc(t("th.newBars"))}</th><th class="num">${esc(t("th.totalLen"))}</th><th class="num">${esc(t("th.mass"))}</th><th class="num">${esc(t("th.fromRest"))}</th><th class="num">${esc(t("th.waste"))}</th></tr></thead>
      <tbody>${results.map(R => `<tr>
        <td class="rowhead"><b>ø ${R.g.dia}</b>${R.g.ring ? ` <span class="tag ok">${esc(t("tag.ring"))}</span>` : ""}</td>
        <td class="num" data-label="${esc(t("th.stockLen"))}">${NF(m(R.g.cap))} m</td>
        <td class="num" data-label="${esc(t("th.newBars"))}"><b>${NF0(R.barsNew.length)}</b></td>
        <td class="num" data-label="${esc(t("th.totalLen"))}">${NF(m(R.totalStock), 1)} m</td>
        <td class="num" data-label="${esc(t("th.mass"))}">${NF(R.totalStock * R.kgm / 1000, 1)} kg</td>
        <td class="num" data-label="${esc(t("th.fromRest"))}">${R.usedFromRest ? `<span style="color:var(--ok)">${NF(m(R.usedFromRest), 2)} m</span> <span class="muted">(${R.barsRest.length})</span>` : `<span class="muted">—</span>`}</td>
        <td class="num" data-label="${esc(t("th.waste"))}">${NF(m(R.wasteAll), 2)} m · ${NF(R.wasteAll * R.kgm / 1000, 1)} kg
          <span class="muted">(${NF(R.totalStock ? R.wasteAll / R.totalStock * 100 : 0, 1)} %)</span></td>
      </tr>`).join("")}</tbody>
    </table></div>
  </div>`);

  // Detail je Durchmesser
  results.forEach(R => {
    const ix = new Map(); R.cut.forEach((it, i) => ix.set(it.key, i));
    out.push(`<div class="panel">
      <div class="grp-title">
        <span class="d">ø ${R.g.dia} mm</span>
        <span class="muted small">${esc(t("grp.meta", {
          cap: NF(m(R.g.cap)), nNew: R.barsNew.length, nRest: R.barsRest.length,
          waste: NF(m(R.wasteAll), 2), p: NF(R.totalStock ? R.wasteAll / R.totalStock * 100 : 0, 1)
        }))}</span>
        ${R.barsNew.length === R.lower ? `<span class="tag ok">${esc(t("tag.optimal"))}</span>` :
          `<span class="tag warn">${esc(t("tag.lower", { n: R.lower }))}</span>`}
        <span class="prog" data-prog style="margin-left:auto"></span>
      </div>`);

    if (R.fixed.length) {
      out.push(`<div class="note">${esc(t("grp.notInPlan"))}
        ${R.fixed.map(it => `${esc(it.label)} — ${it.qty}× ${NF(it.lenM)} m`).join(" · ")}</div>`);
    }

    if (!R.bars.length) { out.push(`</div>`); return; }

    // Reststangen-Bilanz
    if (R.remnants.length) {
      const usedLens = R.barsRest.map(b => b.cap);
      const free = R.remnants.slice().sort((a, b) => b - a);
      usedLens.forEach(L => { const i = free.indexOf(L); if (i >= 0) free.splice(i, 1); });
      out.push(`<div class="note" style="border-color:var(--ok); background:var(--ok-soft)">
        ${t("rest.balance", {
          have: R.remnants.length, haveLen: NF(m(R.remnantTotal), 2),
          used: R.barsRest.length, usedLen: NF(m(R.usedFromRest), 2),
          savedKg: NF(R.usedFromRest * R.kgm / 1000, 1), leftover: NF(m(R.restLeftover), 2),
          free: free.length ? free.map(L => NF(m(L)) + " m").join(", ") : ""
        })}
      </div>`);
    }

    // Musterübersicht (kompakt, für Zuschnitt und Bestellung) — nur neue Stangen
    const pat = new Map();
    R.bars.filter(b => b.kind === "neu").forEach(b => {
      const k = b.pieces.map(p => p.len).join("+");
      if (!pat.has(k)) pat.set(k, { lens: b.pieces.map(p => p.len), n: 0, rest: b.rest, ids: [] });
      const e = pat.get(k); e.n++; e.ids.push(b.id);
    });
    if (pat.size) out.push(`<h3>${esc(t("pat.h"))}</h3>
      <div class="tbl-scroll"><table class="resp">
        <thead><tr><th class="num">${esc(t("th.count"))}</th><th>${esc(t("pat.per", { cap: NF(m(R.g.cap)) }))}</th><th class="num">${esc(t("th.rest"))}</th><th class="num">${esc(t("th.wasteTotal"))}</th></tr></thead>
        <tbody>${[...pat.values()].sort((a, b) => b.n - a.n).map(e => `<tr>
          <td class="num" data-label="${esc(t("th.count"))}"><b>${e.n}×</b></td>
          <td data-label="${esc(t("pat.per", { cap: NF(m(R.g.cap)) }))}">${e.lens.map(L => NF(m(L))).join(" + ")}</td>
          <td class="num" data-label="${esc(t("th.rest"))}">${NF(m(e.rest))} m</td>
          <td class="num" data-label="${esc(t("th.wasteTotal"))}">${NF(m(e.rest * e.n), 2)} m</td>
        </tr>`).join("")}</tbody>
      </table></div>`);

    // Schneideplan — identische Stangen optional zu einem Eintrag zusammenfassen
    const group = $("groupSame").checked;
    const shown = [];
    if (group) {
      const gm = new Map();
      R.bars.forEach(b => {
        const k = b.kind + "#" + b.cap + "#" + b.pieces.map(p => p.it.key + "@" + p.len).join("|");
        if (!gm.has(k)) { gm.set(k, Object.assign({}, b, { ids: [], members: [] })); }
        const e = gm.get(k); e.ids.push(b.id); e.members.push({ id: b.id, key: doneKey(b) });
      });
      shown.push(...gm.values());
    } else {
      R.bars.forEach(b => shown.push(Object.assign({}, b, { ids: [b.id], members: [{ id: b.id, key: doneKey(b) }] })));
    }
    out.push(`<h3 style="margin-top:18px">${esc(t("plan.h"))}${group && shown.length < R.bars.length
      ? ` <span class="muted" style="text-transform:none; letter-spacing:0">${esc(t("plan.grouped", { bars: R.bars.length, groups: shown.length }))}</span>` : ""}</h3>`);
    const maxCap = Math.max(R.g.cap, ...R.bars.map(b => b.cap));
    shown.forEach(b => {
      const segs = b.pieces.map(p => {
        const share = p.len / maxCap;
        const txt = share >= 0.14 ? `${esc(p.it.label)} · ${NF(m(p.len))}` : share >= 0.07 ? NF(m(p.len)) : "";
        return `<div class="seg" style="flex:${p.len} 0 0; background:${colorFor(ix.get(p.it.key))}" title="${esc(p.it.label)} · ${NF(m(p.len))} m">${txt}</div>`;
      }).join("");
      const restSeg = b.rest > 0
        ? `<div class="seg rest" style="flex:${b.rest} 0 0" title="${esc(t("seg.rest"))} ${NF(m(b.rest))} m">${b.rest / maxCap >= 0.09 ? esc(t("seg.rest")) + " " + NF(m(b.rest)) : ""}</div>`
        : "";
      const counts = new Map();
      b.pieces.forEach(p => { const k = p.it.label + "|" + p.len; counts.set(k, (counts.get(k) || 0) + 1); });
      const ids = b.ids, rangeTxt = ids.length === 1 ? ids[0]
        : (ids.length > 2 ? `${ids[0]} – ${ids[ids.length - 1]}` : ids.join(", "));
      const gi = tickGroups.push(b.members.map(mb => mb.key)) - 1;
      out.push(`<div class="bar">
        <div class="bar-head">
          <span>${ids.length > 1 ? `<b>${esc(t("bar.nBars", { n: ids.length }))}</b> <span class="muted">${rangeTxt}</span>` : `<b>${ids[0]}</b>`}
            &nbsp;<span class="muted">${NF(m(b.cap))} m</span>
            ${b.kind === "rest" ? `<span class="tag ok">${esc(t("tag.restBar"))}</span>` : ""}</span>
          <span>${esc(t("bar.used", { x: NF(m(b.used)) }))} · <span style="color:${b.rest >= minRest ? "var(--warn)" : "var(--muted)"}">${esc(t("bar.rest", { x: NF(m(b.rest)) }))}${b.rest >= minRest && b.rest > 0 ? esc(t("bar.usable")) : ""}${ids.length > 1 ? esc(t("bar.totalRest", { x: NF(m(b.rest * ids.length), 2) })) : ""}</span></span>
        </div>
        <div class="bar-vis" style="width:${(b.cap / maxCap * 100).toFixed(2)}%">${segs}${restSeg}</div>
        <div class="chips">${[...counts.entries()].map(([k, n]) => {
          const [lab, L] = k.split("|");
          return `<span class="chip">${n}× ${esc(lab)} &nbsp;${NF(m(+L))} m${ids.length > 1 ? ` <span class="muted">${esc(t("bar.perBar"))}</span>` : ""}</span>`;
        }).join("")}</div>
        <div class="ticks">
          <label class="tick">
            <input type="checkbox" data-donegrp="${gi}">
            <span>${esc(t("bar.done"))}</span>
          </label>
          ${b.members.length > 1 ? `<span class="tickcount">${esc(t("bar.appliesAll", { n: b.members.length }))}</span>` : ""}
        </div>
      </div>`);
    });

    // Zuordnung Position -> Stangen
    out.push(`<h3 style="margin-top:18px">${esc(t("assign.h"))}</h3>
      <div class="tbl-scroll"><table class="resp">
        <thead><tr><th>${esc(t("th.position"))}</th><th>${esc(t("th.list"))}</th><th class="num">${esc(t("th.length"))}</th><th class="num">${esc(t("th.qty"))}</th><th>${esc(t("th.cutFrom"))}</th></tr></thead>
        <tbody>${R.cut.map(it => {
          const src = new Map();
          R.bars.forEach(b => b.pieces.forEach(p => { if (p.it.key === it.key) src.set(b.id, (src.get(b.id) || 0) + 1); }));
          // Aufeinanderfolgende Stangen mit gleicher Stückzahl zu Bereichen zusammenfassen
          const seq = [...src.entries()], runs = [];
          const idxOf = new Map(); R.bars.forEach((b, i) => idxOf.set(b.id, i));
          seq.forEach(([id, n]) => {
            const last = runs[runs.length - 1];
            if (last && last.n === n && idxOf.get(id) === idxOf.get(last.to) + 1) last.to = id;
            else runs.push({ from: id, to: id, n });
          });
          const srcTxt = runs.map(r => r.from === r.to
            ? `${r.from}<span class="muted">&nbsp;${esc(t("assign.times", { n: r.n }))}</span>`
            : `<b>${r.from} – ${r.to}</b><span class="muted">&nbsp;${esc(t("assign.each", { n: r.n }))}</span>`).join(", ");
          return `<tr>
            <td class="rowhead"><span class="chip" style="background:${colorFor(ix.get(it.key))}; color:#10131a; border:none">${esc(it.label)}</span>
              <span class="small muted only-mob">${esc(t("assign.posOf", { list: it.list, pos: it.pos }))}</span></td>
            <td class="small muted hide-mob" data-label="${esc(t("th.list"))}">${esc(t("assign.posOf", { list: it.list, pos: it.pos }))}</td>
            <td class="num" data-label="${esc(t("th.length"))}">${NF(it.lenM)} m</td>
            <td class="num" data-label="${esc(t("th.qty"))}">${it.qty}</td>
            <td class="small wide" data-label="${esc(t("th.cutFrom"))}">${srcTxt}</td>
          </tr>`;
        }).join("")}</tbody>
      </table></div>`);

    // Reststücke
    if (R.usableRest.length) {
      out.push(`<details><summary>${esc(t("usable.summary", { n: R.usableRest.length, x: NF(m(minRest)) }))}</summary>
        <div class="chips" style="margin-top:6px">${R.usableRest.map(b => `<span class="chip">${b.id}: ${NF(m(b.rest))} m</span>`).join("")}</div>
      </details>`);
    }
    out.push(`</div>`);
  });

  // Verschnittverursacher
  out.push(renderWasteRanking(results));
  $("out").innerHTML = out.join("");
  document.body.classList.add("hasresult");
  $("resultTools").classList.remove("hidden");
  clearStale();
  $("btnCalc").textContent = t("btn.calc");
  refreshTicks();
  updateJump();
  if (!keepScroll) $("out").scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderWasteRanking(results) {
  const rows = [];
  results.forEach(R => R.analysis.forEach(a => rows.push({ R, a })));
  if (!rows.length) return "";
  rows.sort((x, y) => (y.a.marginal * y.R.kgm) - (x.a.marginal * x.R.kgm) || y.a.wasteAlone - x.a.wasteAlone);

  // Fixlänge lohnt erst, wenn der einsparbare Verschnitt mind. eine ganze Lagerstange ausmacht.
  const worth = r => r.a.marginal >= r.R.g.cap && r.a.ownRatio >= 0.05;
  const top = rows.filter(r => r.a.marginal > 0).slice(0, 3);
  let rec;
  if (!rows.some(worth)) {
    const c = top[0];
    rec = c ? `<div class="note">${t("wa.noCand", {
      label: esc(c.a.it.label), qty: c.a.it.qty, len: NF(c.a.it.lenM), dia: c.a.it.dia,
      marg: NF(m(c.a.marginal), 2), kg: NF(c.a.marginal * c.R.kgm / 1000, 1)
    })}</div>` : "";
  } else if (!top.length) {
    rec = `<div class="note ok" style="border-color:var(--ok); background:var(--ok-soft)">${esc(t("wa.none"))}</div>`;
  } else {
    const cands = rows.filter(worth);
    const c = cands[0], others = cands.slice(1, 4);
    const totKg = cands.reduce((s, r) => s + r.a.marginal * r.R.kgm / 1000, 0);
    rec = `<div class="note warn">
      ${t("wa.rec", {
        label: esc(c.a.it.label), dia: c.a.it.dia, qty: c.a.it.qty, len: NF(c.a.it.lenM), list: esc(c.a.it.list),
        marg: NF(m(c.a.marginal), 2), kg: NF(c.a.marginal * c.R.kgm / 1000, 1),
        bars: NF(c.a.wasteBars, 1), cap: NF(m(c.R.g.cap)), perBar: c.a.perBar
      })}
      ${others.length
        ? t("wa.recOthers", {
            list: others.map(r => `<b>${esc(r.a.it.label)}</b> (${r.a.it.qty}× ${NF(r.a.it.lenM)} m, +${NF(m(r.a.marginal), 2)} m)`).join(", "),
            kg: NF(totKg, 1)
          })
        : t("wa.recNoOthers")}
      ${t("wa.recHint")}
    </div>`;
  }

  return `<div class="panel">
    <h2>${esc(t("wa.h"))}</h2>
    ${rec}
    <div class="tbl-scroll"><table class="resp">
      <thead><tr>
        <th>${esc(t("th.position"))}</th><th class="num">ø</th><th class="num">${esc(t("th.qtyLen"))}</th>
        <th class="num">${esc(t("th.marginal"))}</th><th class="num">${esc(t("th.alone"))}</th>
        <th class="num">${esc(t("th.perBar"))}</th><th>${esc(t("th.rating"))}</th>
      </tr></thead>
      <tbody>${rows.map(({ R, a }) => {
        const marg = m(a.marginal), margKg = a.marginal * R.kgm / 1000;
        const w = worth({ R, a });
        const cls = w ? "bad" : a.marginal > 0 ? "warn" : "ok";
        const txt = t(w ? "tag.orderFix" : a.marginal > 0 ? "tag.cutSelf" : "tag.filler");
        return `<tr>
          <td class="rowhead"><b>${esc(a.it.label)}</b> <span class="small muted">${esc(a.it.list)}</span>
            <span class="only-mob">· ø ${a.it.dia} · ${a.it.qty} × ${NF(a.it.lenM)} m</span></td>
          <td class="num hide-mob" data-label="ø">${a.it.dia}</td>
          <td class="num hide-mob" data-label="${esc(t("th.qtyLen"))}">${a.it.qty} × ${NF(a.it.lenM)} m</td>
          <td class="num" data-label="${esc(t("th.marginal"))}">${marg > 0 ? "+" : ""}${NF(marg, 2)} m<br><span class="small muted">${margKg > 0 ? "+" : ""}${NF(margKg, 1)} kg</span></td>
          <td class="num" data-label="${esc(t("th.alone"))}">${NF(m(a.wasteAlone), 2)} m<br><span class="small muted">${NF(a.wasteAloneRatio * 100, 1)} %</span></td>
          <td class="num" data-label="${esc(t("th.perBar"))}">${a.perBar}</td>
          <td data-label="${esc(t("th.rating"))}"><span class="tag ${cls}">${esc(txt)}</span></td>
        </tr>`;
      }).join("")}</tbody>
    </table></div>
    <p class="small muted" style="margin:10px 0 0">${t("wa.foot")}</p>
  </div>`;
}

$("btnCalc").onclick = () => {
  $("btnCalc").textContent = t("btn.calcBusy");
  setTimeout(() => { try { calc(); } finally { $("btnCalc").textContent = t("btn.calc"); } }, 20);
};

/* ---------- Sprache anwenden / apply language ---------- */
let restoreNote = null;

function applyStatic() {
  document.documentElement.lang = LANG;
  document.title = t("html.title");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll("[data-i18n-title]").forEach(el => { el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll("#langsw button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  if (restoreNote) restoreNote.innerHTML = t("msg.restored", { n: Object.keys(state.done || {}).length });
}

/* Sprachwechsel: statische Texte neu setzen, Eingabemaske neu zeichnen und —
   falls schon gerechnet wurde — die Ausgabe aus dem letzten Ergebnis neu aufbauen.
   Language switch: re-apply static text, redraw the input form and, if a plan has
   already been calculated, re-render the output from the last result. */
function setLang(lang, initial) {
  LANG = I18N[lang] ? lang : "de";
  try { localStorage.setItem(LS_LANG, LANG); } catch (e) { /* egal */ }
  applyStatic();
  if (initial) return;
  renderLists();
  if (lastResult && lastResult.empty) showNoItems();
  else if (lastResult) render(lastResult.results, lastResult.errors, lastResult.minRest, true);
  updateJump();
}

$("langsw").addEventListener("click", e => {
  const b = e.target.closest("button[data-lang]"); if (!b) return;
  if (b.dataset.lang !== LANG) setLang(b.dataset.lang, false);
});

/* ---------- Start ---------- */
try { const l = localStorage.getItem(LS_LANG); if (l && I18N[l]) LANG = l; } catch (e) { /* egal */ }
state = demoState();
if (loadStored()) {
  $("stockDefault").value = state.stockDefault;
  $("minRest").value = state.minRest;
  restoreNote = document.createElement("div");
  restoreNote.className = "note no-print";
  document.querySelector(".wrap").insertBefore(restoreNote, document.querySelector(".panel"));
}
if (!state.done) state.done = {};
setLang(LANG, true);
renderLists();

/* Am Telefon steht zuerst die Stückliste. Material und Reststangen bleiben
   zugeklappt — die Zusammenfassung in der Kopfzeile zeigt, was drinsteht.
   Reststangen klappen auf, sobald welche erfasst sind. */
const AM_TELEFON = window.matchMedia("(max-width:760px)").matches;
if (AM_TELEFON) $("secMaterial").open = false;
else if ((state.rests || []).length) $("secRests").open = true;
updateJump();
</script>
